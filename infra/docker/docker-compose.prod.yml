services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # service_healthy (not service_started) so Caddy doesn't proxy to
      # an API or web that's still warming up — the difference between
      # a clean start and a few minutes of intermittent 502s on cold
      # deploys. Pre-2.4.27 the web service was gated only on
      # service_started, which Docker considers green the moment the
      # container's ENTRYPOINT process is running, NOT once it's
      # accepting connections. Next.js standalone has a measurable
      # warm-up window where `node server.js` is alive but the listen
      # socket is not yet open — Caddy started proxying immediately and
      # the first user requests after a `make prod` got 502s for ~5–15
      # seconds. Now both upstreams must report healthy.
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    restart: unless-stopped
    networks: [nis2-net]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nis2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nis2}
      # Read by initdb/01-create-app-role.sh on first volume init.
      NIS2_APP_PASSWORD: ${NIS2_APP_PASSWORD:?NIS2_APP_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Provisions the nis2_app NOSUPERUSER NOBYPASSRLS runtime role. This
      # mount is what the whole RLS security model depends on, and it did not
      # exist: initdb/sql/01-create-app-role.sql was written, documented and
      # referenced by the README as the tenant-isolation mechanism, while being
      # mounted by no compose file and executed on no deployment. Every install
      # therefore ran the API as the bootstrap superuser, for which Postgres
      # bypasses RLS unconditionally -- FORCE ROW LEVEL SECURITY included.
      #
      # Read-only: the container must never be able to alter its own bootstrap.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$POSTGRES_USER (escaped for compose) so the check follows a customised
      # POSTGRES_USER instead of the hardcoded `nis2` it used to assume. With
      # the literal, changing the user left the healthcheck failing forever and
      # Caddy -- which gates on service_healthy -- never started.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    networks: [nis2-net]

  redis:
    image: redis:7-alpine
    # `${VAR:?msg}` (docker compose syntax): HARD-FAIL with a clear message if
    # REDIS_PASSWORD is unset/empty, instead of silently falling back to the
    # well-known "changeme". A weak default on the broker — even on an
    # internal-only port — is worse than a loud startup error pointing the
    # operator at .env. (The `:?` form also avoids the empty-string
    # "ERR wrong number of arguments for 'requirepass'" crash Davide hit.)
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    environment:
      # Re-expose the password inside the container so the healthcheck
      # below can read it from $REDIS_PASSWORD instead of having compose
      # expand it at spec-build time. Two upsides:
      #   (a) the same compose file works whether `.env` has the var or not;
      #   (b) the password isn't baked into the rendered spec (visible via
      #       `docker inspect`), only into the container's env.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      # `$$` escapes one $ so docker compose passes literal `$REDIS_PASSWORD`
      # to the shell inside the container, which then expands it. The
      # `--no-auth-warning` silences the "WARNING: Using -a on the CLI"
      # banner that older redis-cli prints to stderr (still exit 0, but
      # noisy on `docker compose logs`).
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [nis2-net]

  api:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    # 4 workers x (DB_POOL_SIZE 10 + DB_MAX_OVERFLOW 5) = 60 connections, which
    # fits inside postgres's max_connections of 100 alongside the Celery worker,
    # beat, and a psql session. Changing the worker count here without changing
    # the pool settings below is how the API came to demand 120 against a
    # 100-connection server.
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    # L11: block setuid-based privilege escalation inside the container.
    security_opt: ["no-new-privileges:true"]
    volumes:
      - reports-data:/tmp/nis2-reports
    env_file: ../../.env
    environment:
      # ENVIRONMENT is a property of WHICH COMPOSE FILE YOU RAN, not of a
      # hand-edited .env line. Compose gives `environment:` precedence over
      # `env_file:`, so this cannot be downgraded by a stale or copied .env.
      #
      # Why this is here: `.env.example` used to ship ENVIRONMENT=development
      # and `make prod`'s preflight never checked it. Following the README
      # verbatim therefore produced a PRODUCTION deployment running in DEV
      # mode, which silently disabled FIVE separate controls at once:
      #   1. Settings._validate_runtime_config returns early -> no JWT_SECRET
      #      strength check, no CORS allow-list check, no DATA_ENCRYPTION_KEY
      #      requirement (app/config.py).
      #   2. _cookie_secure() returns False -> access/refresh/csrf cookies are
      #      issued WITHOUT the Secure flag behind Caddy's HTTPS
      #      (app/routers/auth.py).
      #   3. The unauthenticated GET /api/v1/auth/debug/last-email helper is
      #      mounted (app/routers/auth.py).
      #   4. The in-memory dev outbox swallows every outbound email instead of
      #      dialling the MTA (app/utils/email.py) — so password resets and
      #      Art. 23 deadline alerts went to a log line.
      #   5. assert_db_role_rls_safe() skips the SUPERUSER/BYPASSRLS refusal
      #      (app/database.py), leaving RLS decorative.
      # (3) + (4) chained into unauthenticated account takeover:
      # forgot-password -> read the reset link from the debug endpoint ->
      # reset-password. The dev compose already pins ENVIRONMENT per service;
      # prod now matches so the two files are symmetric and neither depends on
      # operator diligence.
      ENVIRONMENT: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [nis2-net]
    # Caddy sits in front and proxies /api/* to this service; without a
    # healthcheck Caddy can race the API and serve 502s during the
    # 5–30s startup window (RLS bootstrap + schema sync).
    healthcheck:
      # /health/ready, NOT /health.
      #
      # By design (see app/routers/health.py) /health is a LIVENESS probe that
      # "never returns a non-200" — it reports the Python process is routing and
      # checks nothing else. Both compose files pointed the container healthcheck
      # at it, so `--wait` and Caddy's `depends_on: service_healthy` gated on a
      # signal that cannot fail. Observed directly: with the database
      # unreachable, `docker compose up --wait` returned success, every service
      # showed `healthy`, and every API request 500'd. /health/ready reported
      # {"status":"degraded","checks":{"database":"error",...}} the whole time.
      #
      # Readiness is the correct semantics for gating dependents: do not route
      # traffic to an API that cannot reach its database. Docker does not restart
      # containers on `unhealthy`, so this cannot cause a restart loop — it only
      # holds back whatever depends on the service.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=8).status==200 else 1)"]
      interval: 10s
      # 10s, not 3s. /health/ready pings the Celery workers via the broker and
      # `control.ping` always waits its full _CELERY_PING_TIMEOUT (3s) — it
      # cannot know whether another worker is about to reply. Measured: the
      # endpoint answers 200 in a steady 3.15s. With `timeout: 3s` Docker killed
      # every probe (health log: exit=-1, i.e. timed out, never a real failure),
      # so the api container sat permanently `unhealthy` while answering
      # correctly on every manual request.
      timeout: 10s
      retries: 12
      start_period: 30s

  celery-worker:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    # L11: block privilege escalation + cap process fan-out. The worker spawns
    # scan subprocesses and headless Chromium; pids_limit backstops a fork bomb
    # without starving Chromium (gated to 2 concurrent by the scanner's L5 cap).
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    volumes:
      - reports-data:/tmp/nis2-reports
    env_file: ../../.env
    environment:
      # Tells app.database to use NullPool. Each Celery task runs in a
      # fresh asyncio loop (asyncio.run per task); a pooled asyncpg
      # connection held over from a prior task carries a now-closed loop
      # and throws "Future attached to a different loop" on reuse. The dev
      # compose sets this on worker + beat — prod MUST too, or scheduled
      # scans, report generation, and incident-deadline alerts silently
      # stop after the first task. See the _CELERY_WORKER_MODE comment
      # block in packages/api/app/database.py.
      CELERY_WORKER: "1"
      # Pinned for the same reason as the api service above — see the long
      # note there. The worker specifically needs it for the RLS boot guard
      # in app/tasks/celery_app.py (_enforce_rls_role), which is gated on
      # production and would otherwise never fire.
      ENVIRONMENT: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [nis2-net]
    # P2-07 audit fix: healthcheck for worker liveness. Without this,
    # a worker that dies silently (OOM, broker disconnect) leaves scans
    # in `pending` forever with no Docker-level signal. `celery inspect
    # ping` contacts the worker through the broker and fails if it
    # doesn't respond within timeout.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout 5 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    # See the dev compose for context: the default beat scheduler writes
    # a SQLite-shelve file to the working directory, and that file
    # cannot survive a host bind-mount through WSL2's `/mnt/c` proxy.
    # In prod we don't have a bind-mount, but we still want the beat
    # schedule to survive container restarts so cron-style triggers
    # don't double-fire after a deploy — hence the named volume.
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/var/celerybeat/schedule
    # L11: block setuid-based privilege escalation inside the container.
    security_opt: ["no-new-privileges:true"]
    volumes:
      - celerybeat_data:/var/celerybeat
    env_file: ../../.env
    environment:
      # Same NullPool fix as celery-worker above; the dev compose sets
      # CELERY_WORKER on both services, so prod matches to avoid drift.
      CELERY_WORKER: "1"
      # Pinned for the same reason as the api service above.
      ENVIRONMENT: production
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [nis2-net]

  web:
    build:
      context: ../../packages/web
      dockerfile: Dockerfile
      target: production
    # The production stage builds Next.js as a *standalone* bundle: only
    # `.next/standalone/server.js`, `.next/static/` and `public/` are
    # copied into the final image — no `node_modules`, no `package.json`,
    # no `next` binary. The Dockerfile CMD is already `node server.js`.
    # The previous `command: npm start` invoked `next start`, which then
    # crashed with `sh: next: not found` and the container restart-looped
    # forever (reported by Davide on Docker Desktop / WSL2). Letting
    # the Dockerfile CMD run is the only correct option.
    # NO env_file HERE, deliberately.
    #
    # This service used to load the whole of ../../.env, which handed the
    # Next.js container JWT_SECRET, POSTGRES_PASSWORD, NIS2_APP_PASSWORD,
    # DATA_ENCRYPTION_KEY, SMTP_PASSWORD and OPENAI_API_KEY. It reads exactly
    # three variables (NODE_ENV, NEXT_PUBLIC_API_URL, INTERNAL_API_URL) and uses
    # none of the rest. The frontend is the most exposed surface in the stack,
    # so a template-injection or path-traversal bug there was handing over the
    # JWT signing key and the database credentials for free.
    #
    # A second reason to keep this list explicit: Next.js inlines every
    # NEXT_PUBLIC_*-prefixed variable into the browser bundle at build time.
    # With the whole .env loaded, adding one carelessly named variable to it
    # publishes that value to every visitor.
    environment:
      # Browser-side: the public domain (in front of Caddy).
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://localhost}
      # Server-side: where the Next.js process inside this container
      # reaches the API for rewrites. Internal docker DNS, not the
      # public URL.
      - INTERNAL_API_URL=http://api:8000
    restart: unless-stopped
    networks: [nis2-net]
    # node:20-alpine doesn't ship curl/wget, but it always has node
    # itself. The Next.js standalone server returns 200 (or 307 redirect
    # to /login) on `/` once the listen socket is open — the right gate
    # for Caddy's `service_healthy` dependency above. start_period
    # covers the cold-build warm-up; interval/retries together give us
    # ~50s of grace before the container is marked unhealthy.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ../../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # v2.5.6 security fix: removed `ports: ["9099:9090"]`.  Prometheus
    # has NO built-in authentication — exposing it on a host port let
    # anyone on the network read internal service names, Docker DNS
    # topology, and operational metrics (request rates, error counts,
    # latency distributions).  Prometheus is now reachable ONLY within
    # the Docker network (nis2-net) — Grafana or alertmanager connect
    # via `http://prometheus:9090`.  If external access is needed,
    # route through Caddy with basic_auth.
    expose: ["9090"]
    restart: unless-stopped
    networks: [nis2-net]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  prometheus_data:
  celerybeat_data:
  reports-data:

networks:
  nis2-net:
    driver: bridge
