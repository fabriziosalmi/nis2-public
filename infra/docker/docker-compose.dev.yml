services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nis2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nis2secret}
      POSTGRES_DB: ${POSTGRES_DB:-nis2}
      # Read by initdb/01-create-app-role.sh on first volume init. Dev needs the
      # role for the same reason prod does: .env.example points DATABASE_URL at
      # nis2_app, so without this mount `make dev` comes up with an API that
      # cannot authenticate to its own database.
      NIS2_APP_PASSWORD: ${NIS2_APP_PASSWORD:-devapppw}
    # Security: bind to loopback only. `make dev` on an untrusted LAN must not
    # expose Postgres (default creds) to the network — and Docker's iptables
    # rules bypass a host firewall, so the explicit 127.0.0.1 is the guard.
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Kept symmetric with prod so the two stacks cannot drift on the security
      # model. Dev exercising the same least-privilege role as prod is also the
      # only way the RLS policies get tested by everyday work.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Parameterised, like prod: the literal `-U nis2` left the healthcheck
      # failing forever on any deployment that customised POSTGRES_USER.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # v2.5.6 security fix: require a password even in dev.  Pre-fix,
    # Redis was exposed on the host (0.0.0.0:6379) with NO auth — any
    # local process could read/write Celery tasks, poison report
    # results, or extract cached session data.  Now:
    #   1. --requirepass is set (same REDIS_PASSWORD from .env)
    #   2. Host port mapping is REMOVED — services talk via Docker DNS
    # If you need a redis-cli session for debugging, use:
    #   docker compose exec redis redis-cli -a "${REDIS_PASSWORD:-changeme}"
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
      # Stamped into the image so a running container can be traced back to
      # its source. Empty when the variables are unset, and the Dockerfile
      # defaults to "unknown" — misleading nobody.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        APP_VERSION: ${APP_VERSION:-unknown}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../../packages/api/app:/app/packages/api/app:ro
      - ../../packages/api/alembic:/app/packages/api/alembic
      - ../../packages/scanner/nis2scan:/app/packages/scanner/nis2scan:ro
      # `make db-seed` runs `python -m scripts.seed` from WORKDIR
      # /app/packages/api; the repo's scripts/ isn't otherwise in the
      # image, so mount it here (read-only) or the target ModuleNotFounds.
      - ../../scripts:/app/packages/api/scripts:ro
      # v2.4.19: shared volume for generated reports. The Celery
      # worker writes the rendered file under /tmp/nis2-reports;
      # the API's GET /reports/download/{task_id} reads from the
      # SAME path. Without sharing, the worker's /tmp is invisible
      # to the api container — every download 404'd. Named volume
      # so it survives container restarts (devs don't lose reports
      # mid-debug); for prod a real shared filesystem or object
      # store is the right answer.
      - reports-data:/tmp/nis2-reports
    # Security: loopback-only (see postgres). Off-host access is opt-in.
    ports: ["127.0.0.1:8000:8000"]
    env_file: ../../.env
    environment:
      ENVIRONMENT: development
      # Mounts the unauthenticated GET /auth/debug/last-email helper, which the
      # e2e suite and the local password-reset flow read the reset link from.
      # Opt-in on purpose: it used to ride on ENVIRONMENT alone, so one wrong
      # variable exposed a full account-takeover chain. Settings refuses to boot
      # if this is ever set with ENVIRONMENT=production. Dev stack only.
      ENABLE_DEV_EMAIL_DEBUG: "true"
      # `uvicorn --reload` uses the `watchfiles` library, which relies on
      # inotify. inotify events do not propagate from a Windows-hosted
      # filesystem through WSL2's `/mnt/c` proxy, so without polling the
      # API simply never picks up Python edits. Same family as the
      # WATCHPACK_POLLING fix on the web service. Cheap on Linux hosts.
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Using python instead of wget/curl because the slim API image ships
      # neither but always has python; no extra layer needed.
      # /health/ready, NOT /health.
      #
      # By design (see app/routers/health.py) /health is a LIVENESS probe that
      # "never returns a non-200" — it reports the Python process is routing and
      # checks nothing else. Both compose files pointed the container healthcheck
      # at it, so `--wait` and Caddy's `depends_on: service_healthy` gated on a
      # signal that cannot fail. Observed directly: with the database
      # unreachable, `docker compose up --wait` returned success, every service
      # showed `healthy`, and every API request 500'd. /health/ready reported
      # {"status":"degraded","checks":{"database":"error",...}} the whole time.
      #
      # Readiness is the correct semantics for gating dependents: do not route
      # traffic to an API that cannot reach its database. Docker does not restart
      # containers on `unhealthy`, so this cannot cause a restart loop — it only
      # holds back whatever depends on the service.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=8).status==200 else 1)"]
      interval: 5s
      # 10s, not 3s. /health/ready pings the Celery workers via the broker and
      # `control.ping` always waits its full _CELERY_PING_TIMEOUT (3s) — it
      # cannot know whether another worker is about to reply. Measured: the
      # endpoint answers 200 in a steady 3.15s. With `timeout: 3s` Docker killed
      # every probe (health log: exit=-1, i.e. timed out, never a real failure),
      # so the api container sat permanently `unhealthy` while answering
      # correctly on every manual request.
      timeout: 10s
      retries: 20
      start_period: 30s

  celery-worker:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ../../packages/api/app:/app/packages/api/app:ro
      - ../../packages/api/alembic:/app/packages/api/alembic
      - ../../packages/scanner/nis2scan:/app/packages/scanner/nis2scan:ro
      # Mirrors the api service so the worker's report writes are
      # visible to the api's download endpoint. See the api block.
      - reports-data:/tmp/nis2-reports
    env_file: ../../.env
    environment:
      ENVIRONMENT: development
      # v2.4.19: tells `app.database` to use NullPool. Celery's
      # prefork worker mints a fresh asyncio event loop per task
      # via `asyncio.run(...)`; pooled asyncpg connections from a
      # previous task carry a now-closed loop reference and throw
      # `Future attached to a different loop` on reuse. NullPool
      # sidesteps that — same fix the integration tests already
      # use. See the comment block in app/database.py.
      CELERY_WORKER: "1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  celery-beat:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    # The default beat scheduler is a SQLite-shelve file (`celerybeat-
    # schedule`) written to the working directory. The working dir is
    # `/app/packages/api`, which is bind-mounted from the host. On
    # Docker Desktop with WSL2 + a Windows-hosted source tree, file
    # locking semantics through the `/mnt/c` proxy do not satisfy
    # SQLite's POSIX-locking requirements, so beat crashes on first
    # write and exit-loops. `/tmp` lives on tmpfs *inside* the container
    # — fast, locking-correct, and isolated from the host filesystem.
    # On Linux hosts this is just a slightly faster path; on WSL2 it
    # is what makes celery-beat boot at all. (Reported by Davide)
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - ../../packages/api:/app/packages/api
    env_file: ../../.env
    environment:
      ENVIRONMENT: development
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: ../../packages/web
      dockerfile: Dockerfile
      target: dev
      # Stamped into the image so a running container can be traced back to
      # its source. Empty when the variables are unset, and the Dockerfile
      # defaults to "unknown" — misleading nobody.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        APP_VERSION: ${APP_VERSION:-unknown}
    command: npm run dev
    volumes:
      - ../../packages/web:/app
      - /app/node_modules
      - /app/.next
    # Security: loopback-only (see postgres). Off-host access is opt-in.
    ports: ["127.0.0.1:8077:3000"]
    # No env_file: the web service reads only the three variables below.
    # See the note on the same service in docker-compose.prod.yml — loading the
    # whole .env handed the frontend container the JWT signing key and the
    # database credentials it has no use for, and risks publishing anything
    # NEXT_PUBLIC_*-prefixed into the browser bundle. Kept symmetric with prod
    # so the two files do not drift.
    environment:
      # Browser-side: where the user's browser reaches the API directly.
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Server-side: where the Next.js process inside this container
      # reaches the API for rewrites. `api` resolves via docker DNS.
      - INTERNAL_API_URL=http://api:8000
      # Windows/WSL2 file watcher fix. Native chokidar/inotify events
      # do not propagate from a Windows-mounted filesystem into WSL2,
      # which makes Next.js never finish its initial dev compile and
      # leaves the browser stuck on the SSR'd "Loading..." fallback.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true

volumes:
  pgdata:
  # v2.4.19: shared between api + celery-worker so generated reports
  # are visible to the download endpoint. See the bind comments on
  # each service.
  reports-data:
