# gitleaks 8.x configuration.
#
# We extend the upstream default rule set rather than replacing it: every
# built-in detector (AWS keys, RSA private keys, JWT tokens, etc.) keeps
# firing as before. The allowlist below carves out narrow, file-scoped
# exceptions for material that *intentionally* looks secret-shaped but
# is documented test or placeholder data — never a real credential.

[extend]
useDefault = true

[allowlist]
description = "NIS2-specific allowlist for known test fixtures and CI placeholders"

# packages/scanner/tests/test_features.py exists to verify the
# secrets-detection scanner actually catches real-looking secrets. It
# embeds the canonical AWS docs sample key (AKIAIOSFODNN7EXAMPLE) and
# locally-generated RSA test keys. These are intentional test inputs;
# without them the scanner has no positive coverage. None are real.
paths = [
    '''packages/scanner/tests/test_features\.py''',
    # test_secrets_detection.py embeds canonical JWT example tokens (from jwt.io
    # documentation) to verify the scanner's JWT detection rule fires. These are
    # well-known public examples; none are real credentials.
    '''packages/scanner/tests/test_secrets_detection\.py''',
    # test_jwt_rs256.py patches settings with placeholder HS256 secrets and uses
    # runtime-generated RSA keypairs for round-trip coverage. None are real.
    '''packages/api/tests/test_jwt_rs256\.py''',
    # test_totp_mfa.py uses pyotp.random_base32() — no hardcoded secrets.
    # Listed here proactively so future additions to this file don't break CI.
    '''packages/api/tests/test_totp_mfa\.py''',
    # test_dev_email_debug_gate.py builds Settings objects that must satisfy the
    # production validator, so it needs a jwt_secret of >= 32 characters with no
    # placeholder marker. The first version used a pseudo-random literal, which
    # generic-api-key flagged and which turned this job red; the fixture is now
    # a repeated character, but the original literal survives in the history
    # this scan walks. Nothing here was ever a live credential.
    '''packages/api/tests/test_dev_email_debug_gate\.py''',
    # test_notification_channels.py asserts that webhook secrets and Slack
    # tokens are MASKED before they leave the API, so it has to construct
    # credential-shaped values ("s3cr3t", "xoxb-1") to check they do not come
    # back. Removing them would remove the coverage.
    '''packages/api/tests/test_notification_channels\.py''',
]

# Specific placeholder values pinned in non-test files but obviously not
# real credentials. Keep this list narrow — every entry here weakens the
# real scan, so prefer `paths` when possible.
regexes = [
    # AWS canonical sample access key from AWS public documentation.
    # Cited in their own developer guides; flagged here too to allow
    # any future test or doc reference.
    '''AKIAIOSFODNN7EXAMPLE''',
    # Placeholder JWT secrets used in .github/workflows/ci.yml for
    # integration-tests and E2E jobs. Long enough to satisfy the production
    # secret-length validator without being a real production secret.
    '''integration-test-secret-must-be-at-least-32-chars-long-yes''',
    '''e2e-test-jwt-secret-must-be-at-least-32-chars-yes''',
    # The fixed public marker that goes into the asset-verification DNS TXT
    # record. It is not a credential — it is the same string for every
    # deployment, published in DNS on purpose — but it was originally assigned
    # to a constant named TOKEN_PREFIX, and generic-api-key reacts to a variable
    # named *TOKEN*. The constant is now CHALLENGE_VALUE_PREFIX, which is what
    # it actually is; this entry covers the commit that introduced the old name,
    # since the scan walks history. Narrower than allowlisting the file, which
    # deals in real verification tokens.
    '''nis2-verification=''',
    # Throwaway password used for the E2E CI seed user. Never used outside CI.
    '''E2eC!password99''',
    # localStorage key prefixes used by the bilingual docs home and the
    # legal-disclaimer modal. Versioned (-v1, -v2, …) so we can force
    # re-acceptance on material text changes. Gitleaks 8's
    # `generic-api-key` detector flags them on entropy alone (~3.74)
    # despite the obvious `nis2-` prefix. Listed here so a future bump
    # doesn't break CI and prompt yet another debug round.
    '''nis2-legal-disclaimer-v\d+''',
    '''nis2-doc-legal-disclaimer-v\d+''',
    '''nis2-doc-locale''',
    '''nis2-auth-v\d+''',
    '''nis2-dashboard-orientation-v\d+''',
    '''nis2-findings-pii-notice-v\d+''',
]
