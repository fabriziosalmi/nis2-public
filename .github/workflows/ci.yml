name: CI -- Full Stack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Node 22 LTS (Active until 2027-10). The lockfile is generated
  # with npm 11 (Node 22+); npm 10 (Node 20) reads it as out-of-sync.
  # GitHub Actions also deprecated Node 20 runners (Sept 2025).
  NODE_VERSION: "22"

jobs:
  # -----------------------------------------------------------------------
  # Scanner Engine Tests
  # -----------------------------------------------------------------------
  scanner-tests:
    name: Scanner Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scanner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-asyncio
      - name: Run scanner tests
        run: python -m pytest tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # API Tests (no DB — unit tests only)
  # -----------------------------------------------------------------------
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    # Unit tests don't need real config; ENVIRONMENT=development relaxes
    # the boot-time JWT_SECRET / CORS_ORIGINS validation so app.main
    # imports cleanly during pytest collection.
    env:
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e packages/scanner
          pip install -e packages/api
          pip install pytest pytest-asyncio httpx slowapi
      - name: Run API tests
        run: cd packages/api && python -m pytest tests/ -v --tb=short --ignore=tests/test_integration.py

  # -----------------------------------------------------------------------
  # Integration Tests — exercises RLS, refresh-token rotation, audit
  # log writes, CSRF enforcement against a real Postgres service.
  # -----------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nis2
          POSTGRES_PASSWORD: nis2secret
          POSTGRES_DB: nis2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nis2"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: production
      # The app connects as nis2_app (NOSUPERUSER NOBYPASSRLS) created
      # below. Postgres lets superusers bypass RLS unconditionally — even
      # FORCE ROW LEVEL SECURITY does not bind them — so we cannot connect
      # the app as the postgres bootstrap user (`nis2`) and meaningfully
      # exercise the failsafe.
      DATABASE_URL: postgresql+asyncpg://nis2_app:apppwd@localhost:5432/nis2_test
      DATABASE_URL_SYNC: postgresql://nis2_app:apppwd@localhost:5432/nis2_test
      JWT_SECRET: integration-test-secret-must-be-at-least-32-chars-long-yes
      CORS_ORIGINS: http://localhost:3000
      INTEGRATION_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e packages/scanner
          pip install -e packages/api
          pip install pytest pytest-asyncio httpx slowapi
      - name: Provision non-superuser app role (RLS-bound)
        # Create a dedicated NOSUPERUSER NOBYPASSRLS role for the app to
        # connect as. The bootstrap-superuser `nis2` cannot be demoted
        # (Postgres refuses), so we provision a sibling role and grant it
        # the privileges it needs to own and manipulate the test schema.
        env:
          PGPASSWORD: nis2secret
        run: |
          psql -h localhost -U nis2 -d nis2_test <<'SQL'
          CREATE ROLE nis2_app WITH LOGIN PASSWORD 'apppwd' NOSUPERUSER NOBYPASSRLS;
          GRANT ALL ON SCHEMA public TO nis2_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO nis2_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO nis2_app;
          SQL
      - name: Run integration tests
        run: cd packages/api && python -m pytest tests/test_integration.py -v --tb=short

  # -----------------------------------------------------------------------
  # E2E Live Tests — full API stack (Postgres + Redis) in CI
  #
  # test_e2e_live.py is skipped automatically when E2E_LIVE_BASE_URL is
  # not set (plain `pytest` stays green). This job provides the
  # environment the test file expects: a real API server reachable over
  # HTTP, backed by real Postgres and Redis.
  #
  # Architecture: we start postgres and redis as GHA services, run
  # Alembic migrations, then launch the FastAPI app with uvicorn in the
  # background. A polling loop waits until GET /api/v1/health returns 200
  # before running the test suite. No docker-compose is needed — GHA
  # services and `run: uvicorn &` give us the same isolation more cheaply.
  #
  # A dedicated E2E user is created (not a real admin account) so the
  # tests don't depend on pre-seeded data and can run against a clean DB.
  # -----------------------------------------------------------------------
  e2e-tests:
    name: E2E Live Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nis2
          POSTGRES_PASSWORD: nis2secret
          POSTGRES_DB: nis2_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nis2"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://nis2:nis2secret@localhost:5432/nis2_e2e
      DATABASE_URL_SYNC: postgresql://nis2:nis2secret@localhost:5432/nis2_e2e
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: e2e-test-jwt-secret-must-be-at-least-32-chars-yes
      CORS_ORIGINS: http://localhost:3000
      # Mounts the unauthenticated /auth/debug/last-email helper that
      # TestForgotPassword reads the reset link from. Opt-in since the
      # deployment-defaults hardening: ENVIRONMENT alone no longer exposes it,
      # because one wrong variable used to be enough for account takeover.
      ENABLE_DEV_EMAIL_DEBUG: "true"
      # Credentials used both to register the E2E user and to run the suite.
      E2E_LIVE_BASE_URL: http://localhost:8000
      E2E_LIVE_EMAIL: e2e-ci@example.com
      E2E_LIVE_PASSWORD: E2eC!password99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e packages/scanner
          pip install -e packages/api
          pip install pytest pytest-asyncio httpx slowapi uvicorn[standard] alembic

      - name: Run Alembic migrations
        run: cd packages/api && alembic upgrade head

      - name: Start API server (background)
        run: |
          cd packages/api
          uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            --log-level warning &
          echo "API PID: $!"

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "API is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: API did not start within 30 s"
          exit 1

      - name: Seed E2E user
        run: |
          # Register the E2E account via the public registration endpoint.
          # Idempotent: a 409 (already exists) is also acceptable.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${E2E_LIVE_EMAIL}\",\"password\":\"${E2E_LIVE_PASSWORD}\",\"full_name\":\"E2E CI User\",\"org_name\":\"E2E CI Org\"}")
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "409" ]; then
            echo "ERROR: Registration returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Seed user ready (HTTP $HTTP_CODE)"

      - name: Run E2E tests
        run: |
          cd packages/api
          python -m pytest tests/test_e2e_live.py -v --tb=short

  # -----------------------------------------------------------------------
  # Web Build Check
  # -----------------------------------------------------------------------
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      # `next lint` was removed in Next.js 16 and there was no ESLint config, so
      # `npm run lint` errored and CI never ran it. 12,500 lines of TypeScript
      # were checked only by tsc, which says nothing about unused state, missing
      # hook dependencies, or an <a> where a <Link> belongs.
      - name: Lint
        run: npm run lint
      # The first frontend tests in this project. 13,618 lines of TypeScript
      # were checked only by tsc and ESLint, neither of which can tell whether
      # a countdown counts down — and the countdown in question is the Art. 23
      # statutory one.
      - name: Test
        run: npm test
      # `next build` type-checks as a side effect, but a dedicated step fails
      # faster and says plainly which of the two broke.
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  # -----------------------------------------------------------------------
  # Python Lint
  # -----------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      # Whole packages, not just the source directories. Pointing ruff at
      # nis2scan/ and app/ left packages/*/tests and scripts/ unchecked, and 16
      # findings under this very rule set were sitting in them — including a
      # test file added the same week with an unused import, which CI passed.
      # An unused import in a test is often the residue of an assertion that was
      # moved or deleted, so the defect class this catches there is "this test no
      # longer checks what it was written to check".
      - name: Lint scanner
        run: ruff check packages/scanner/ --select=E,W,F --ignore=E501
      - name: Lint API
        run: ruff check packages/api/ --select=E,W,F --ignore=E501
      - name: Lint scripts
        run: ruff check scripts/ --select=E,W,F --ignore=E501

  # -----------------------------------------------------------------------
  # Policy Checks (cheap repo-wide invariants)
  # -----------------------------------------------------------------------
  policy-checks:
    name: Policy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No .env committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env is tracked in git!"
            exit 1
          fi
          echo "OK: .env not in git"
      - name: No bare except
        run: |
          if grep -rn "^[[:space:]]*except:$" --include="*.py" packages/ ; then
            echo "ERROR: bare except: statements found"
            exit 1
          fi
          echo "OK: No bare except: found"
      - name: No CORS wildcard
        run: |
          if grep -q 'allow_origins=\["\*"\]' packages/api/app/main.py; then
            echo "ERROR: CORS wildcard detected"
            exit 1
          fi
          echo "OK: CORS properly restricted"

  # -----------------------------------------------------------------------
  # Docker stack — builds the images and BOOTS them
  #
  # No CI job had ever built these images or started this stack, and it showed.
  # Found by hand, all of it invisible to the existing suites:
  #
  #   * `make prod` could not start at all — compose resolves ${VAR}
  #     interpolation from the project directory's .env (infra/docker/, which has
  #     none), so the `:?` guards rejected the file outright;
  #   * the container healthcheck pointed at /health, a liveness probe documented
  #     as never returning non-200, so `--wait` reported success while the API
  #     could not reach its database;
  #   * the postgres initdb script that provisions the least-privilege role was
  #     mounted by no compose file and could not have run as written;
  #   * `make db-seed` wrote tenant rows with no RLS context.
  #
  # The comments in docker-compose.prod.yml still credit a human ("reported by
  # Davide", "restart-looped forever") for finding earlier ones. That is the gap
  # this job closes.
  # -----------------------------------------------------------------------
  docker-stack:
    name: Docker Build & Boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Synthesise a .env the way an operator would
        # Mirrors the README: copy the template, fill the secrets. If
        # .env.example drifts into a shape that cannot produce a working
        # deployment, this step is where it surfaces.
        run: |
          cp .env.example .env
          APP_PW=$(openssl rand -hex 16)
          DB_PW=$(openssl rand -hex 16)
          RD_PW=$(openssl rand -hex 16)
          sed -i "s|CHANGE_ME_APP_ROLE_PASSWORD|${APP_PW}|g" .env
          sed -i "s|CHANGE_ME_DB_PASSWORD|${DB_PW}|g" .env
          sed -i "s|CHANGE_ME_REDIS_PASSWORD|${RD_PW}|g" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^CORS_ORIGINS=.*|CORS_ORIGINS=http://localhost:8077|" .env
          sed -i "s|^DOMAIN=.*|DOMAIN=localhost|" .env

      - name: Preflight must accept it
        run: make prod-preflight

      - name: Build and boot the dev stack
        # --wait fails the job if any service does not reach `healthy`. That is
        # the point: it was passing on a stack whose every request 500'd, because
        # the healthcheck could not fail.
        run: |
          docker compose --env-file .env -f infra/docker/docker-compose.dev.yml \
            up -d --build --wait --wait-timeout 300

      - name: The API must be READY, not merely alive
        run: |
          curl -sf http://localhost:8000/api/v1/health/ready | tee /dev/stderr | grep -q '"status":"ok"'

      - name: The runtime role must be the least-privilege one
        # Postgres bypasses RLS for superusers, so this is what decides whether
        # tenant isolation is enforced or decorative.
        run: |
          docker compose --env-file .env -f infra/docker/docker-compose.dev.yml \
            exec -T postgres psql -U nis2 -d nis2 -tAc \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname='nis2_app'" | grep -qx f

      - name: Seed, then prove cross-tenant isolation
        run: |
          docker compose --env-file .env -f infra/docker/docker-compose.dev.yml \
            exec -T api python -m scripts.seed
          bash scripts/h5_validate.sh

      - name: A real request must work end to end
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"C!password99","full_name":"CI","org_name":"CI Org"}')
          test "$CODE" = 201 || { echo "register returned $CODE"; exit 1; }

      # ---------------------------------------------------------------
      # Backup and restore, exercised rather than documented.
      #
      # UPGRADING.md tells the operator to take a pg_dump before upgrading and
      # says "the dump is your rollback" — and nothing in this repository had
      # ever performed a restore. A rollback plan whose first execution is
      # during an incident is not a plan, and two things in particular were
      # unverified: that the dump is sufficient, and that a restored database
      # is at the same Alembic revision as the code expects.
      #
      # This runs against the stack the job has already seeded, so the dump has
      # real rows in it.
      - name: Backup, restore, and prove the restored copy is usable
        run: |
          set -euo pipefail
          COMPOSE="docker compose --env-file .env -f infra/docker/docker-compose.dev.yml"
          PGUSER=$(grep '^POSTGRES_USER=' .env | cut -d= -f2-)
          PGDB=$(grep '^POSTGRES_DB=' .env | cut -d= -f2-)

          echo "--- rows before the dump"
          BEFORE=$($COMPOSE exec -T postgres psql -U "$PGUSER" -d "$PGDB" -tAc \
            "select count(*) from organizations")
          echo "organizations: $BEFORE"
          test "$BEFORE" -gt 0 || { echo "nothing seeded; the drill would prove nothing"; exit 1; }

          echo "--- dump (the command UPGRADING.md gives the operator)"
          $COMPOSE exec -T postgres pg_dump -U "$PGUSER" "$PGDB" > /tmp/backup.sql
          test -s /tmp/backup.sql || { echo "empty dump"; exit 1; }

          echo "--- restore into a fresh database"
          $COMPOSE exec -T postgres psql -U "$PGUSER" -d postgres -c \
            "drop database if exists nis2_restored"
          $COMPOSE exec -T postgres psql -U "$PGUSER" -d postgres -c \
            "create database nis2_restored"
          $COMPOSE exec -T -e PGOPTIONS=--client-min-messages=warning postgres \
            psql -q -v ON_ERROR_STOP=1 -U "$PGUSER" -d nis2_restored < /tmp/backup.sql

          echo "--- the data survived"
          AFTER=$($COMPOSE exec -T postgres psql -U "$PGUSER" -d nis2_restored -tAc \
            "select count(*) from organizations")
          echo "organizations: $AFTER"
          test "$AFTER" = "$BEFORE" || { echo "restore lost rows: $BEFORE -> $AFTER"; exit 1; }

          echo "--- and the restored copy carries the schema version"
          REV=$($COMPOSE exec -T postgres psql -U "$PGUSER" -d nis2_restored -tAc \
            "select version_num from alembic_version")
          echo "alembic_version: $REV"
          test -n "$REV" || { echo "restored database is not stamped; an upgrade would misbehave"; exit 1; }

          echo "--- migrating the restored copy must be a no-op, not an error"
          $COMPOSE exec -T \
            -e DATABASE_URL="postgresql+asyncpg://$PGUSER:$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)@postgres:5432/nis2_restored" \
            -e MIGRATION_DATABASE_URL="postgresql+asyncpg://$PGUSER:$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)@postgres:5432/nis2_restored" \
            api alembic upgrade head

      - name: The production compose file must at least resolve
        # Not booted here (it wants port 80/443 and a real domain), but a
        # `config` that fails is exactly how `make prod` was broken.
        run: docker compose --env-file .env -f infra/docker/docker-compose.prod.yml config -q

      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker/docker-compose.dev.yml logs --tail 120

      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f infra/docker/docker-compose.dev.yml down -v

  # -----------------------------------------------------------------------
  # Version consistency
  #
  # `VERSION` at the repo root is the single source of truth; the four manifests
  # and SECURITY.md's supported-versions table are derived from it. Everything
  # this guards had already drifted: manifests at 2.6.10 against a newest tag of
  # v2.6.8, CHANGELOG.md missing entries for eight tagged releases, and
  # SECURITY.md naming 2.5.x as current for the whole 2.6 series while telling
  # operators on 2.4.x they were still receiving patches.
  #
  # The git-tag requirement is NOT checked here: between releases the tree is
  # legitimately ahead of the newest tag, and failing every commit for that would
  # train people to ignore the gate. `make version-check-release` adds it at
  # release time.
  # -----------------------------------------------------------------------
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check VERSION against every derived file
        run: python scripts/version.py check

  # -----------------------------------------------------------------------
  # Python dependency vulnerability scan
  # -----------------------------------------------------------------------
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install workspace and pip-audit
        run: |
          # Upgrade pip itself first — older pip in the runner image has
          # CVE-2026-3219, and pip-audit will flag it on the installed
          # environment otherwise.
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e packages/scanner
          pip install -e packages/api
      - name: Audit installed Python dependencies
        # `--skip-editable` excludes our own monorepo packages (nis2scan,
        # nis2-api) which are installed via `pip install -e` and therefore
        # not published to PyPI. Without --strict, real vulnerabilities
        # still fail the job; missing-from-PyPI warnings do not.
        run: pip-audit --skip-editable

  # -----------------------------------------------------------------------
  # Web dependency vulnerability scan
  # -----------------------------------------------------------------------
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit (high+)
        run: npm audit --omit=dev --audit-level=high

      # The repository root is a second npm project — the VitePress docs build —
      # with its own lockfile, and this job's working-directory never reached it.
      # That is how release 2.6.10, cut specifically to pin nanoid, left the same
      # advisory open in the root lockfile: the fix landed in packages/web and
      # nothing audited the other half. Dev dependencies are included here
      # because for a docs build that is all there is.
      - name: Audit repository root (docs build)
        working-directory: .
        run: |
          npm ci
          npm audit --audit-level=high

  # -----------------------------------------------------------------------
  # Secret detection on full git history
  # -----------------------------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1

  # -----------------------------------------------------------------------
  # Filesystem vulnerability + misconfiguration scan
  # -----------------------------------------------------------------------
  trivy-fs:
    name: trivy fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy filesystem scan
        run: |
          # Bumped from 0.50.4 — that release was removed from GitHub
          # (asset 404). 0.70.0 keeps the same `trivy_VERSION_Linux-64bit`
          # naming, so the URL pattern is unchanged.
          TRIVY_VERSION=0.70.0
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp trivy
          /tmp/trivy fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            .
