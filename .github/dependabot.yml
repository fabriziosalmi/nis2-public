version: 2

# Every entry groups its minor and patch updates into one pull request per
# directory. With auto-merge and "require branches to be up to date", many
# single-dependency pull requests stall behind main (Dependabot rebases on
# conflicts, not on "behind"); a few grouped ones touch the same lockfile and get
# rebased. Majors are not in any group: they stay separate and are merged by hand.
#
# There is no pip manifest and no Dockerfile at the repository root: the Python
# packages and the images live under packages/, so only those directories are
# listed for pip and docker.
updates:
  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/packages/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      pip-api-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/packages/scanner"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      pip-scanner-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/packages/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-web-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/packages/api"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-api-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/packages/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Odd Node majors are never LTS and reach end of life within months
      # (Node 25 ended 2026-06-01). Move between even LTS lines by hand.
      - dependency-name: "node"
        versions: [">=25, <26", ">=27, <28", ">=29, <30", ">=31, <32"]
    groups:
      docker-web-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions-root-minor-patch:
        update-types:
          - "minor"
          - "patch"
