# Prometheus configuration for the NIS2 Compliance Platform.
#
# Mounted read-only into the prometheus container by
# infra/docker/docker-compose.prod.yml at /etc/prometheus/prometheus.yml.
#
# Why this file is in the repo: when the bind-mount source path doesn't
# exist on the host, Docker Desktop on Windows silently creates an empty
# *directory* there, and the mount then fails with "not a directory: Are
# you trying to mount a directory onto a file (or vice-versa)?" — which
# is exactly the trap Davide fell into on his first `make prod`.
# Keeping the file tracked in git makes the directory-creation race
# impossible.
#
# Scrape targets reach each service over the docker-compose user-defined
# bridge network (`nis2-net`) using the service name as DNS — those
# names are not externally resolvable.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: nis2

scrape_configs:
  # Self-monitoring: Prometheus exposes its own metrics on /metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The API exposes /metrics as of 2.6.18. Until then this job pointed at an
  # endpoint that did not exist, so a deployment came up with two of its three
  # targets permanently red — no application telemetry at all, and a monitoring
  # system that trains whoever looks at it to ignore red targets.
  #
  # Series worth alerting on:
  #   nis2_db_pool_connections_in_use / nis2_db_pool_capacity
  #       Per worker. Four gunicorn workers each hold their own pool, so
  #       saturation used to arrive with no warning: Postgres refuses the
  #       connection, readiness fails, and Caddy stops routing.
  #   rate(nis2_http_requests_total{status=~"5.."}[5m])
  #   histogram_quantile(0.95, rate(nis2_http_request_duration_seconds_bucket[5m]))
  - job_name: nis2-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Deliberately NOT scraping the web service. Next.js in standalone mode
  # exposes nothing at /metrics, and a job that can only ever fail is worse than
  # no job: it is a permanently red target that teaches an operator to stop
  # reading the target list. Re-add it alongside an endpoint that answers, not
  # in anticipation of one.
