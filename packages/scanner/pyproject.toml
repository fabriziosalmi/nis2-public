[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nis2scan"
version = "2.6.13"
description = "NIS2 Directive compliance scanner engine"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3",  # CVE-2025-69223 (HTTP Parser auto_decompress) fixed in 3.13.3
    "aiodns>=3.1",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "dnspython>=2.6",
    # scapy removed in v2.4.10 — never imported in the codebase, dragged in
    # GHSA-pq98-w3cw-pgcr (untrusted-pickle session deserialization, no
    # patched release as of 2026-04). Re-add only with a justified use.
    # Reads the certificate's own public key. The key strength check used to
    # infer it from the negotiated cipher suite, which describes the session
    # and not the certificate: TLS 1.3 suite names carry no authentication
    # algorithm at all, and the "size" taken from the suite was the symmetric
    # key length.
    "cryptography>=42.0",
    "prometheus_client>=0.26.0",
    "python-whois>=0.9",
    "Jinja2>=3.1",
    "watchdog>=4.0",
    "playwright>=1.49",
]

[project.scripts]
nis2scan = "nis2scan.cli:cli"

[tool.setuptools.packages.find]
include = ["nis2scan*"]

# secret_patterns.yaml is CODE, not documentation: secrets.py loads it at import
# and falls back to a reduced hardcoded set when it is absent. Without this
# declaration setuptools shipped only the .py files, so every containerised
# deployment ran secret detection on the fallback — 29 patterns replaced by a
# handful — while the README advertised the full set. It logs a warning, which
# is more than the platform's other silent degradations managed, but nobody
# reads container logs.
[tool.setuptools.package-data]
nis2scan = ["*.yaml"]
